version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: orbitquery-db
    environment:
      POSTGRES_USER: orbitquery
      POSTGRES_PASSWORD: orbitquery
      POSTGRES_DB: orbitquery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitquery"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
