{% extends 'base.html' %}

{% block title %}Benchmark History - OrbitQuery{% endblock %}

{% block content %}
<div class="row mb-4">

        <h1 class="h3 mb-3">Benchmark History</h1>
    </div>
</div>

<div class="row">
    <div class="col-12">
